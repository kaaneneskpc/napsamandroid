# Sürüm paketi (docs/CI.md, docs/RELEASE.md): yönetilen emülatörde Baseline + Startup Profile üretir,
# profille AAB derler ve upload anahtarıyla imzalar. İmza sırları tanımlı değilse AAB hata ayıklama
# anahtarıyla imzalanır, uyarı verilir ve artifact adı bunu söyler (Play'e yüklenemez).
# Play internal track yüklemesi Play hesabı hazır olunca eklenecek.
name: Sürüm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paket:
    name: Baseline Profile ve AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK, Gradle ve bellek ayarı
        uses: ./.github/actions/gradle-kurulum

      # Yönetilen emülatörün donanım hızlandırması için.
      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # CI=true iken :benchmark yalnızca yönetilen cihazı (pixel6Api34) kullanır.
      - name: Baseline + Startup Profile üret
        run: >-
          ./gradlew :app:generateReleaseBaselineProfile
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1

      # Anahtar deposu yalnızca runner'ın geçici klasörüne yazılır; parolalar yalnızca bu adımlara verilir.
      - name: İmza anahtarı
        id: imza
        env:
          KEYSTORE_BASE64: ${{ secrets.NAPSAM_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::İmza sırları tanımlı değil; AAB hata ayıklama anahtarıyla imzalanacak ve Play'e yüklenemez."
            echo "tur=hata-ayiklama-imzali" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "NAPSAM_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "tur=imzali" >> "$GITHUB_OUTPUT"

      - name: AAB
        env:
          NAPSAM_UPLOAD_STORE_PASSWORD: ${{ secrets.NAPSAM_UPLOAD_KEYSTORE_PASSWORD }}
          NAPSAM_UPLOAD_KEY_ALIAS: ${{ secrets.NAPSAM_UPLOAD_KEY_ALIAS }}
          NAPSAM_UPLOAD_KEY_PASSWORD: ${{ secrets.NAPSAM_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Anahtar deposunu sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Üretilen profil repoya elle eklenir (app/src/release/generated/baselineProfiles/).
      - name: Paketi yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napsam-${{ github.ref_name }}-${{ steps.imza.outputs.tur }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/src/release/generated/baselineProfiles/
          if-no-files-found: error
          retention-days: 30

      - name: Hata raporları
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raporlar
          path: |
            **/build/reports/
            **/build/outputs/androidTest-results/
          retention-days: 7
